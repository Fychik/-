<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Косово — точная граница (GeoJSON)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .leaflet-control-title {
            background: rgba(0,0,0,0.7); color: white; padding: 8px 15px; border-radius: 5px;
            font-size: 18px; font-weight: bold; pointer-events: none;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const map = L.map('map').setView([42.5, 20.8], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Заголовок (опционально)
    const titleControl = L.control({ position: 'topleft' });
    titleControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-control-title');
        div.innerHTML = 'Граница Косово (точные данные)';
        return div;
    };
    titleControl.addTo(map);

    // Стиль для Косово
    const kosStyle = {
        color: '#e6a800',
        weight: 2,
        fillColor: '#ffd633',
        fillOpacity: 0.35
    };

    // Загрузка границы из GeoJSON-файла (убедитесь, что файл лежит рядом с index.html)
    fetch('kosovo.geojson')   // <-- подставьте имя вашего файла, если отличается
        .then(response => response.json())
        .then(data => {
            const kosovoLayer = L.geoJSON(data, { style: kosStyle }).addTo(map);
            map.fitBounds(kosovoLayer.getBounds());
        })
        .catch(err => {
            console.error('Ошибка загрузки границы Косово:', err);
            alert('Не удалось загрузить границу. Проверьте, что файл kosovo.geojson находится в той же папке, что и index.html.');
        });
</script>
</body>
</html>
